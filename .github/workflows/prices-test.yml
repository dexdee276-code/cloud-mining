name: Test price fetch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample prices (read only)
        run: |
          cat > t.js <<'JS'
          const syms = ['AAPL','NVDA','TSLA','2330.TW','005930.KS','2222.SR'];
          (async () => {
            for (const s of syms) {
              let ok = false;
              for (const host of ['query1','query2']) {
                try {
                  const r = await fetch('https://' + host + '.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(s) + '?range=5d&interval=1d', { headers: { 'User-Agent': 'Mozilla/5.0' } });
                  if (!r.ok) { console.log(s, host, 'HTTP', r.status); continue; }
                  const j = await r.json();
                  const m = j.chart.result[0].meta;
                  console.log('OK', s, m.currency, 'price', m.regularMarketPrice, 'prevClose', m.chartPreviousClose);
                  ok = true; break;
                } catch (e) { console.log(s, host, 'ERROR', String(e)); }
              }
              if (!ok) console.log('FAIL', s);
            }
          })();
          JS
          node t.js
