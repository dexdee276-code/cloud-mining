name: Update stock prices
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update prices in Firebase
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          cat > u.js <<'JS'
          const DB = 'https://cryptomine-b1f8d-default-rtdb.firebaseio.com';
          const SECRET = process.env.FIREBASE_SECRET;
          if (!SECRET) { console.log('FIREBASE_SECRET is missing'); process.exit(1); }
          const UA = { 'User-Agent': 'Mozilla/5.0' };
          const toY = s => (/^\d+-[A-Z]{1,3}$/.test(s) ? s.replace('-', '.') : s);
          const r4 = n => Math.round(n * 10000) / 10000;
          async function yget(sym) {
            for (const h of ['query1', 'query2']) {
              try {
                const r = await fetch('https://' + h + '.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + '?range=5d&interval=1d', { headers: UA });
                if (!r.ok) continue;
                const j = await r.json();
                return j.chart.result[0];
              } catch (e) {}
            }
            return null;
          }
          async function quote(sym) {
            const r = await yget(toY(sym));
            if (!r) return null;
            const cl = ((r.indicators.quote[0] || {}).close || []).filter(v => typeof v === 'number' && v > 0);
            const price = r.meta.regularMarketPrice;
            if (!(price > 0) || cl.length < 2) return null;
            return { price, prev: cl[cl.length - 2], cur: r.meta.currency || 'USD' };
          }
          const fxc = {};
          async function fx(cur) {
            if (cur === 'USD') return 1;
            if (fxc[cur]) return fxc[cur];
            const r = await yget(cur + 'USD=X');
            const v = r && r.meta.regularMarketPrice;
            if (!(v > 0)) return null;
            fxc[cur] = v;
            return v;
          }
          async function dbj(path, opt) {
            const r = await fetch(DB + '/' + path + (path.includes('?') ? '&' : '?') + 'auth=' + SECRET, opt);
            if (!r.ok) throw new Error('Firebase HTTP ' + r.status);
            return r.json();
          }
          function histOf(old) {
            let a = old && old.hist;
            if (!a) return [];
            if (!Array.isArray(a)) a = Object.keys(a).map(k => a[k]);
            return a.filter(q => q && q[1] > 0).map(q => [+q[0], +q[1]]);
          }
          (async () => {
            const keys = Object.keys((await dbj('stocks.json?shallow=true')) || {});
            console.log('stocks in database:', keys.length);
            const today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
            let ok = 0, fail = 0;
            for (const k of keys) {
              try {
                const old = (await dbj('stocks/' + k + '.json')) || {};
                const q = await quote(k);
                if (!q) { console.log('SKIP', k, 'no quote'); fail++; continue; }
                const f = await fx(q.cur);
                if (!f) { console.log('SKIP', k, 'no fx for', q.cur); fail++; continue; }
                const price = r4(q.price * f), prev = r4(q.prev * f);
                if (old.price > 0 && Math.abs(price / old.price - 1) > 0.6) { console.log('SKIP', k, 'price jump too large', old.price, '->', price); fail++; continue; }
                const h = histOf(old);
                const last = h[h.length - 1];
                const lastDay = last ? new Date(last[0] + 7 * 3600e3).toISOString().slice(0, 10) : '';
                if (last && lastDay === today) last[1] = price; else h.push([Date.now(), price]);
                await dbj('stocks/' + k + '.json', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price, prev, updated: Date.now(), hist: h.slice(-120) }) });
                console.log('OK', k, price, 'prev', prev);
                ok++;
              } catch (e) { console.log('ERROR', k, String(e)); fail++; }
            }
            console.log('done: ok', ok, 'failed', fail);
            if (!ok) process.exit(1);
          })();
          JS
          node u.js
