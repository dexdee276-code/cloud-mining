name: Update stock prices
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update prices in Firebase
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          cat > u.js <<'JS'
          const DB = 'https://cryptomine-b1f8d-default-rtdb.firebaseio.com';
          const SECRET = process.env.FIREBASE_SECRET;
          if (!SECRET) { console.log('FIREBASE_SECRET is missing'); process.exit(1); }
          const UA = { 'User-Agent': 'Mozilla/5.0' };
          const toY = s => (/^\d+-[A-Z]{1,3}$/.test(s) ? s.replace('-', '.') : s);
          const r4 = n => Math.round(n * 10000) / 10000;
          async function yget(sym, qs) {
            for (const h of ['query1', 'query2']) {
              try {
                const r = await fetch('https://' + h + '.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + (qs || '?range=1y&interval=1d&events=div'), { headers: UA });
                if (!r.ok) continue;
                const j = await r.json();
                return j.chart.result[0];
              } catch (e) {}
            }
            return null;
          }
          async function quote(sym) {
            const r = await yget(toY(sym));
            if (!r) return null;
            const ts = r.timestamp || [], cc = (r.indicators.quote[0] || {}).close || [];
            const bars = [];
            for (let i = 0; i < ts.length; i++) if (typeof cc[i] === 'number' && cc[i] > 0) bars.push([ts[i] * 1000, cc[i]]);
            const cl = bars.map(b => b[1]);
            const price = r.meta.regularMarketPrice;
            if (!(price > 0) || cl.length < 2) return null;
            const dv = (r.events && r.events.dividends) || {};
            const cut = Date.now() - 365 * 864e5;
            const div = Object.keys(dv).map(k => dv[k]).filter(d => d.date * 1000 >= cut && d.amount > 0).reduce((a, d) => a + d.amount, 0);
            let ih = [];
            try {
              const r2 = await yget(toY(sym), '?range=5d&interval=30m');
              if (r2) {
                const t2 = r2.timestamp || [], c2 = (r2.indicators.quote[0] || {}).close || [];
                for (let i = 0; i < t2.length; i++) if (typeof c2[i] === 'number' && c2[i] > 0) ih.push([t2[i] * 1000, c2[i]]);
              }
            } catch (e) {}
            return { price, prev: cl[cl.length - 2], cur: r.meta.currency || 'USD', bars, ih, div, rmt: r.meta.regularMarketTime || 0, dl: r.meta.regularMarketDayLow || 0, dh: r.meta.regularMarketDayHigh || 0, wl: r.meta.fiftyTwoWeekLow || 0, wh: r.meta.fiftyTwoWeekHigh || 0 };
          }
          const fxc = {};
          async function fx(cur) {
            if (cur === 'USD') return 1;
            if (fxc[cur]) return fxc[cur];
            const r = await yget(cur + 'USD=X');
            const v = r && r.meta.regularMarketPrice;
            if (!(v > 0)) return null;
            fxc[cur] = v;
            return v;
          }
          async function dbj(path, opt) {
            const r = await fetch(DB + '/' + path + (path.includes('?') ? '&' : '?') + 'auth=' + SECRET, opt);
            if (!r.ok) throw new Error('Firebase HTTP ' + r.status);
            return r.json();
          }
          (async () => {
            const keys = Object.keys((await dbj('stocks.json?shallow=true')) || {});
            console.log('stocks in database:', keys.length);
            const today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
            let ok = 0, fail = 0;
            for (const k of keys) {
              try {
                const old = (await dbj('stocks/' + k + '.json')) || {};
                const q = await quote(k);
                if (!q) { console.log('SKIP', k, 'no quote'); fail++; continue; }
                const f = await fx(q.cur);
                if (!f) { console.log('SKIP', k, 'no fx for', q.cur); fail++; continue; }
                const price = r4(q.price * f), prev = r4(q.prev * f);
                if (old.price > 0 && Math.abs(price / old.price - 1) > 0.6) { console.log('SKIP', k, 'price jump too large', old.price, '->', price); fail++; continue; }
                const h = q.bars.map(b => [b[0], r4(b[1] * f)]);
                const lastDay = h.length ? new Date(h[h.length - 1][0] + 7 * 3600e3).toISOString().slice(0, 10) : '';
                if (h.length && lastDay === today) h[h.length - 1][1] = price; else h.push([Date.now(), price]);
                await dbj('stocks/' + k + '.json', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price, prev, updated: Date.now(), rmt: (q.rmt || 0) * 1000, hist: h.slice(-130), ih: q.ih.slice(-90).map(b => [b[0], r4(b[1] * f)]), dy: r4(q.div * f), dl: r4(q.dl * f), dh: r4(q.dh * f), wl: r4(q.wl * f), wh: r4(q.wh * f) }) });
                console.log('OK', k, price, 'prev', prev);
                ok++;
              } catch (e) { console.log('ERROR', k, String(e)); fail++; }
            }
            console.log('done: ok', ok, 'failed', fail);
            if (!ok) process.exit(1);
          })();
          JS
          node u.js
